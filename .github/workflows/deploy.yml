name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_SECRETKEY: ${{ secrets.APP_SECRETKEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          CF_ORIGIN_CERT: ${{ secrets.CF_ORIGIN_CERT }}
          CF_ORIGIN_KEY: ${{ secrets.CF_ORIGIN_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          VITE_LIFF_ID: ${{ secrets.VITE_LIFF_ID }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_SECRETKEY,ADMIN_PASSWORD,CORS_ORIGINS,DB_USERNAME,DB_NAME,DB_PASSWORD,CF_ORIGIN_CERT,CF_ORIGIN_KEY,LINE_CHANNEL_ACCESS_TOKEN,LINE_CHANNEL_ID,VITE_LIFF_ID
          script: |
            set -e
            cd /opt/horpug

            # The backend refuses to start in production without these (see
            # config.Validate); check first so a missing secret aborts the
            # deploy here while the current version keeps running.
            echo "==> Check required secrets"
            if [ ${#APP_SECRETKEY} -lt 32 ]; then echo "APP_SECRETKEY secret must be at least 32 characters"; exit 1; fi
            if [ ${#ADMIN_PASSWORD} -lt 12 ]; then echo "ADMIN_PASSWORD secret must be at least 12 characters"; exit 1; fi

            echo "==> Pull latest code"
            git pull origin master

            echo "==> Write backend/.env"
            printf 'APP_ENV=production\nAPP_SECRETKEY=%s\nADMIN_PASSWORD=%s\nCORS_ORIGINS=%s\nDB_USERNAME=%s\nDB_NAME=%s\nDB_PASSWORD=%s\nAPP_COOKIE_SECURE=true\nPOSTGRES_USER=%s\nPOSTGRES_DB=%s\nPOSTGRES_PASSWORD=%s\nLINE_CHANNEL_ACCESS_TOKEN=%s\nLINE_CHANNEL_ID=%s\n' \
              "$APP_SECRETKEY" "$ADMIN_PASSWORD" "$CORS_ORIGINS" "$DB_USERNAME" "$DB_NAME" "$DB_PASSWORD" "$DB_USERNAME" "$DB_NAME" "$DB_PASSWORD" "$LINE_CHANNEL_ACCESS_TOKEN" "$LINE_CHANNEL_ID" > backend/.env

            echo "==> Write nginx TLS cert (Cloudflare Origin CA, from GitHub secrets — never committed to the repo)"
            mkdir -p nginx/certs
            printf '%s\n' "$CF_ORIGIN_CERT" > nginx/certs/fullchain.pem
            printf '%s\n' "$CF_ORIGIN_KEY" > nginx/certs/privkey.pem
            chmod 600 nginx/certs/privkey.pem

            echo "==> Build and restart containers"
            docker compose up --build -d --remove-orphans

            echo "==> Wait for services to be healthy"
            sleep 20

            echo "==> Container status"
            docker compose ps

            echo "==> Deploy complete"
