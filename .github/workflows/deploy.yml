name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_SECRETKEY: ${{ secrets.APP_SECRETKEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_SECRETKEY,CORS_ORIGINS,DB_USERNAME,DB_NAME,DB_PASSWORD
          script: |
            set -e
            cd /opt/horpug

            echo "==> Pull latest code"
            git pull origin master

            echo "==> Write backend/.env"
            printf 'APP_SECRETKEY=%s\nCORS_ORIGINS=%s\nDB_USERNAME=%s\nDB_NAME=%s\nDB_PASSWORD=%s\nAPP_COOKIE_SECURE=true\nPOSTGRES_USER=%s\nPOSTGRES_DB=%s\nPOSTGRES_PASSWORD=%s\n' \
              "$APP_SECRETKEY" "$CORS_ORIGINS" "$DB_USERNAME" "$DB_NAME" "$DB_PASSWORD" "$DB_USERNAME" "$DB_NAME" "$DB_PASSWORD" > backend/.env

            echo "==> Build and restart containers"
            docker compose up --build -d --remove-orphans

            echo "==> Wait for services to be healthy"
            sleep 20

            echo "==> Container status"
            docker compose ps

            echo "==> Deploy complete"
