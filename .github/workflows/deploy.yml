name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_SECRETKEY: ${{ secrets.APP_SECRETKEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_PASSWORD,APP_SECRETKEY,CORS_ORIGINS
          script: |
            set -e
            cd /opt/horpug

            echo "==> Pull latest code"
            git pull origin master

            echo "==> Write root .env"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD" > .env

            echo "==> Write backend/.env"
            printf 'APP_SECRETKEY=%s\nCORS_ORIGINS=%s\n' \
              "$APP_SECRETKEY" "$CORS_ORIGINS" > backend/.env

            echo "==> Build and restart containers"
            docker compose up --build -d --remove-orphans

            echo "==> Wait for services to be healthy"
            sleep 20

            echo "==> Container status"
            docker compose ps

            echo "==> Deploy complete"
