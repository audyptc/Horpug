info:
  contact: {}
  description: API for the Horpug dormitory management system.
  title: Horpug API
  version: "1.0"
paths:
  /activity-logs:
    get:
      parameters:
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: Filter by entity type
        in: query
        name: entity_type
        type: string
      - description: Filter by entity ID
        in: query
        name: entity_id
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Results per page (default 10, max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apihorpug_internal_http_apiresponse.Meta'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apihorpug_internal_http_apierror.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apihorpug_internal_http_apierror.Error'
      security:
      - BearerAuth: []
      summary: List activity logs
      tags:
      - activity-logs
    post:
      consumes:
      - application/json
      parameters:
      - description: Activity log payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_activitylog_delivery_http.createActivityLogRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/apihorpug_internal_features_activitylog_domain.ActivityLog'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apihorpug_internal_http_apierror.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apihorpug_internal_http_apierror.Error'
      security:
      - BearerAuth: []
      summary: Create an activity log entry
      tags:
      - activity-logs
  /activity-logs/{id}:
    get:
      parameters:
      - description: Activity Log ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apihorpug_internal_features_activitylog_domain.ActivityLog'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apihorpug_internal_http_apierror.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apihorpug_internal_http_apierror.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apihorpug_internal_http_apierror.Error'
      security:
      - BearerAuth: []
      summary: Get an activity log by ID
      tags:
      - activity-logs
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
