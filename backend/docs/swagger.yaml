      note:
        type: string
      room_id:
        type: string
      room_number:
        type: string
      tenant_id:
        type: string
      tenant_name:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      uploaded_date:
        type: string
    type: object
  apihorpug_internal_features_document_domain.DocumentCategory:
