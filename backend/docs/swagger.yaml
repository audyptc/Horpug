      tenant_name:
        type: string
      total_amount:
        type: number
    type: object
  apihorpug_internal_features_invoice_domain.GenerationCandidate:
    properties:
      already_invoiced:
        description: AlreadyInvoiced means the period is billed already; generation
          skips it.
        type: boolean
      contract_id:
        type: string
      end_date:
        type: string
      ended_before_period:
        description: |-
          EndedBeforePeriod flags a contract still active although its end date
          is before the period starts (the tenant stayed on without renewal).
        type: boolean
      has_electricity:
        description: |-
          HasElectricity/HasWater report whether a reading exists in the period.
          Invoices pull meter charges from the period's readings, so a missing
          one bills that room without the charge.
        type: boolean
      has_water:
        type: boolean
      rent_price:
        type: number
      room_id:
        type: string
      room_number:
        type: string
      tenant_name:
        type: string
    type: object
