        $ref: '#/definitions/apihorpug_internal_features_invoice_domain.DocumentDormitory'
      invoice:
        $ref: '#/definitions/apihorpug_internal_features_invoice_domain.Invoice'
      outstanding:
        type: number
      paid_amount:
        type: number
      payments:
        items:
          $ref: '#/definitions/apihorpug_internal_features_invoice_domain.DocumentPayment'
        type: array
      promptpay_payload:
        description: |-
          PromptPayPayload is the EMVCo string to render as a QR code; empty
          when nothing is owed, the invoice is cancelled, or no PromptPay
