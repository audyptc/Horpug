basePath: /api/v1
definitions:
  domain.AssignPermissionsRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.RoleMenuPermissionItem'
        type: array
    type: object
  domain.AssignRoleRequest:
    properties:
      role_id:
        type: string
    type: object
  domain.CreateRoleRequest:
    properties:
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  domain.CreateUserRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
    type: object
  domain.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  domain.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  domain.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  domain.Menu:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      path:
        type: string
      updated_at:
        type: string
    type: object
  domain.Permission:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  domain.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  domain.Role:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      menu_permissions:
        items:
          $ref: '#/definitions/domain.RoleMenuPermission'
        type: array
      name:
        type: string
      updated_at:
        type: string
    type: object
  domain.RoleMenuPermission:
    properties:
      menu_id:
        type: string
      menu_name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/domain.Permission'
        type: array
    type: object
  domain.RoleMenuPermissionItem:
    properties:
      menu_id:
        type: string
      permission_ids:
        items:
          type: string
        type: array
    type: object
  domain.UpdateRoleRequest:
    properties:
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  domain.UpdateUserRequest:
    properties:
      full_name:
        type: string
      is_active:
        type: boolean
      password:
        type: string
    type: object
  domain.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      role:
        $ref: '#/definitions/domain.Role'
      updated_at:
        type: string
    type: object
info:
  contact: {}
  title: API
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email และ Password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.LoginResponse'
      summary: เข้าสู่ระบบ
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh Token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: ออกจากระบบ
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh Token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.LoginResponse'
      summary: ต่ออายุโทเค็น
      tags:
      - auth
  /menus:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Menu'
            type: array
      security:
      - ApiKeyAuth: []
      summary: รายการเมนู
      tags:
      - menus
  /menus/{id}:
    get:
      parameters:
      - description: Menu ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Menu'
      security:
      - ApiKeyAuth: []
      summary: ดูเมนูตาม ID
      tags:
      - menus
  /permissions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Permission'
            type: array
      security:
      - ApiKeyAuth: []
      summary: รายชื่อสิทธิ์
      tags:
      - permissions
  /roles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Role'
            type: array
      security:
      - ApiKeyAuth: []
      summary: รายชื่อบทบาท
      tags:
      - roles
    post:
      consumes:
      - application/json
      parameters:
      - description: Role payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Role'
      security:
      - ApiKeyAuth: []
      summary: สร้างบทบาท
      tags:
      - roles
  /roles/{id}:
    delete:
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: ลบบทบาท
      tags:
      - roles
    get:
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Role'
      security:
      - ApiKeyAuth: []
      summary: ดูข้อมูลบทบาทตาม ID
      tags:
      - roles
    put:
      consumes:
      - application/json
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      - description: Role payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Role'
      security:
      - ApiKeyAuth: []
      summary: แก้ไขบทบาท
      tags:
      - roles
  /roles/{id}/permissions:
    put:
      consumes:
      - application/json
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      - description: Menu-permission assignment payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.AssignPermissionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: กำหนดสิทธิ์ให้บทบาท
      tags:
      - roles
  /roles/active:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Role'
            type: array
      security:
      - ApiKeyAuth: []
      summary: รายชื่อบทบาทที่เปิดใช้งาน
      tags:
      - roles
  /users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.User'
            type: array
      security:
      - ApiKeyAuth: []
      summary: รายชื่อผู้ใช้
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: User payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.User'
      security:
      - ApiKeyAuth: []
      summary: สร้างผู้ใช้
      tags:
      - users
  /users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: ลบผู้ใช้
      tags:
      - users
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
      security:
      - ApiKeyAuth: []
      summary: ดูข้อมูลผู้ใช้ตาม ID
      tags:
      - users
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: User payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
      security:
      - ApiKeyAuth: []
      summary: แก้ไขผู้ใช้
      tags:
      - users
  /users/{id}/role:
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Role assignment payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.AssignRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: กำหนดบทบาทให้ผู้ใช้
      tags:
      - users
schemes:
- http
- https
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
