basePath: /api/v1
definitions:
  apihorpug_internal_features_activitylog_domain.ActivityLog:
    properties:
      action:
        type: string
      created_at:
        type: string
      description:
        type: string
      dormitory_id:
        description: |-
          DormitoryID is the dormitory the event belongs to. It is nil for events
          that aren't tied to one (users, roles, tenants, auth), which only roles
          with full dormitory access can see.
        type: string
      entity_id:
        type: string
      entity_type:
        type: string
      id:
        type: string
      ip_address:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  apihorpug_internal_features_announcement_domain.Announcement:
    properties:
      category:
        type: string
      content:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      dormitory_id:
        type: string
      dormitory_name:
        type: string
      id:
        type: string
      is_pinned:
        description: IsPinned keeps the announcement at the top of the default listing.
        type: boolean
      is_published:
        type: boolean
      is_read:
        description: |-
          IsRead is whether the requesting user has opened this announcement; it
          is per user, not a property of the announcement itself.
        type: boolean
      published_date:
        type: string
      title:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  apihorpug_internal_features_announcement_domain.Summary:
    properties:
      can_manage:
        type: boolean
      unread_count:
        type: integer
    type: object
  apihorpug_internal_features_contract_domain.Contract:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      deposit:
        type: number
      dormitory_id:
        type: string
      dormitory_name:
        type: string
      end_date:
        type: string
      id:
        type: string
      move_out_id:
        type: string
      note:
        type: string
      num_occupants:
        type: integer
      rent_price:
        type: number
      room_id:
        type: string
      room_number:
        type: string
      start_date:
        type: string
      status:
        $ref: '#/definitions/apihorpug_internal_features_contract_domain.ContractStatus'
      tenant_id:
        type: string
      tenant_name:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  apihorpug_internal_features_contract_domain.ContractStatus:
    enum:
    - active
    - expired
    - terminated
    type: string
    x-enum-varnames:
    - ContractStatusActive
    - ContractStatusExpired
    - ContractStatusTerminated
  apihorpug_internal_features_dashboard_domain.ContractStats:
    properties:
      active:
        type: integer
      expiring_soon:
        description: |-
          ExpiringSoon counts active contracts ending within the expiry window
          (today included).
        type: integer
      past_end:
        description: |-
          PastEnd counts contracts still marked active although their end date has
          already passed: nobody has renewed or terminated them.
        type: integer
      total:
        type: integer
    type: object
  apihorpug_internal_features_dashboard_domain.ExpenseStats:
    properties:
      this_month:
        type: number
    type: object
  apihorpug_internal_features_dashboard_domain.InvoiceStats:
    properties:
      outstanding_amount:
        type: number
      outstanding_count:
        type: integer
      overdue_amount:
        type: number
      overdue_count:
        description: |-
          Overdue is the part of the outstanding total that is past its due date.
          Judged from the due date rather than the stored status, which the
          hourly sweeper (invoice usecase RunOverdueSweeper) can lag by up to an
          hour.
        type: integer
    type: object
  apihorpug_internal_features_dashboard_domain.PaymentStats:
    properties:
      received_this_month:
        type: number
    type: object
  apihorpug_internal_features_dashboard_domain.Period:
    properties:
      month:
        type: integer
      year:
        type: integer
    type: object
  apihorpug_internal_features_dashboard_domain.ReadingStats:
    properties:
      missing:
        type: integer
    type: object
  apihorpug_internal_features_dashboard_domain.RepairStats:
    properties:
      in_progress:
        type: integer
      pending:
        type: integer
    type: object
  apihorpug_internal_features_dashboard_domain.RoomStats:
    properties:
      available:
        type: integer
      maintenance:
        type: integer
      occupied:
        type: integer
      total:
        type: integer
    type: object
  apihorpug_internal_features_dashboard_domain.Summary:
