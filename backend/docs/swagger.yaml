  /water-meters:
    get:
      description: Returns every water meter reading for roles with full dormitory
        access, otherwise only readings under dormitories the caller manages. Optionally
        filter by room or dormitory.
      parameters:
      - description: Filter by room ID
        in: query
        name: room_id
        type: string
      - description: Filter by dormitory ID
        in: query
        name: dormitory_id
        type: string
