services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_LIFF_ID: ${VITE_LIFF_ID:-}
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      APP_PORT: 8080
      # Postgres runs as the `postgres` service below; reach it by service
      # name on the shared backend_net network.
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M

  postgres:
    image: postgres:17-alpine
    env_file:
      - ./backend/.env
    # postgres only reads POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB (see
    # the matching keys added to backend/.env) - kept equal to
    # DB_USERNAME/DB_PASSWORD/DB_NAME, which the Go app itself reads.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/snippets/proxy_params.conf:ro
      - ./nginx/generate-cert.sh:/docker-entrypoint-scripts/generate-cert.sh:ro
      - ./nginx/certs:/etc/nginx/certs
    environment:
      # CN/SAN used for the self-signed cert when no real one is mounted yet.
      # Set to the server's public IP (or domain, once you have one) in .env.
      SSL_CN: ${SSL_CN:-localhost}
    entrypoint: ["sh", "/docker-entrypoint-scripts/generate-cert.sh"]
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

networks:
  frontend_net:
  backend_net:

volumes:
  postgres_data:
