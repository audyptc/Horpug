services:
  postgres:
    image: postgres:17-alpine
    container_name: horpug-postgres
    environment:
      POSTGRES_DB: phorpug
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: My!Passw0rdPostG7
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phorpug"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: thaivax-frontend
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: thaivax-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: My!Passw0rdPostG7
      DB_NAME: phorpug
      DB_SSLMODE: disable
      CORS_ORIGINS: http://localhost
    restart: always

  nginx:
    image: nginx:stable-alpine
    container_name: thaivax-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  postgres_data:
