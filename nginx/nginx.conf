server_tokens off;

resolver 127.0.0.11 valid=30s ipv6=off;
resolver_timeout 5s;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=200r/s;

# Plain HTTP: only the health check (used by the Docker healthcheck) and the
# future certbot ACME challenge are served here; everything else redirects to
# HTTPS.
server {
    listen 80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Self-signed certificate for now (no domain yet) — browsers will warn
    # until this is swapped for a Let's Encrypt cert issued for a real
    # domain. Leave HSTS off until then: with a self-signed cert, HSTS can
    # make the site unreachable instead of just showing a warning.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;

    location ^~ /api/ {
        limit_req zone=api_limit burst=300 nodelay;

        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        include /etc/nginx/snippets/proxy_params.conf;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    location ^~ /health {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    location ^~ /docs {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    location ^~ /swagger {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    location / {
        limit_req zone=general_limit burst=300 nodelay;

        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        include /etc/nginx/snippets/proxy_params.conf;
        proxy_set_header X-Forwarded-Host $host;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
